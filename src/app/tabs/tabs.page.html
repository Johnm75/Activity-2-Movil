<!-- Navegación inferior de pestañas | Autor: John Fredy Marciales Morales | Fecha: 2026-11-06 -->
<ion-tabs>
  <!-- Barra fija inferior con acceso directo a inicio, galería privada y cuenta JWT. -->
  <ion-tab-bar slot="bottom">
    <!-- Pestaña de resumen y catálogo remoto API REST. -->
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon aria-hidden="true" name="home"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <!-- Pestaña principal de captura con cámara y almacenamiento local. -->
    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <ion-icon aria-hidden="true" name="images"></ion-icon>
      <ion-label>Galería</ion-label>
    </ion-tab-button>

    <!-- Pestaña de perfil autenticado y cierre de sesión. -->
    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" name="person"></ion-icon>
      <ion-label>Cuenta</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
