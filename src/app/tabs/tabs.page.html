<!--
  @fileoverview Plantilla del contenedor de navegación inferior (`TabsPage`).

  @description
  Define las tres pestañas principales de la aplicación móvil:
  1. «Inicio» (`tab1`): bienvenida y accesos directos claros.
  2. «Galería» (`tab2`): captura con cámara nativa y cuadrícula persistente.
  3. «Cuenta» (`tab3`): diagnóstico seguro de sesión JWT y cierre de sesión.

  @author @ionic-ui-animator (Fase 4 — Diseño)
  @phase SDD Fase 4 — Diseño
-->

<!-- Contenedor de pestañas que administra pilas de navegación independientes. -->
<ion-tabs>

  <!-- Barra de navegación inferior con borde superior y contraste activo. -->
  <ion-tab-bar slot="bottom">

    <!-- Pestaña 1: panel de inicio y accesos directos. -->
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon aria-hidden="true" name="home"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <!-- Pestaña 2: galería de fotografías (vista principal tras iniciar sesión). -->
    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <ion-icon aria-hidden="true" name="images"></ion-icon>
      <ion-label>Galería</ion-label>
    </ion-tab-button>

    <!-- Pestaña 3: perfil autenticado y control de sesión. -->
    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" name="person"></ion-icon>
      <ion-label>Cuenta</ion-label>
    </ion-tab-button>

  </ion-tab-bar>

</ion-tabs>
